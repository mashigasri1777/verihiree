services:
  - type: web
    name: veriresume
    env: python
    buildCommand: "pip install -r requirements.txt && python sample_data/create_samples.py"
    startCommand: "python run_socket_server.py & uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEMO_MODE
        value: "true"
